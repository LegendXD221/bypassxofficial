services:
  - type: web
    name: bypassx
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: BOT_TOKEN
        sync: false
      - key: CLIENT_ID
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: OWNER_USER_IDS
        sync: false
      - key: DISCORD_GUILD_ID
        sync: false
      - key: AUTO_SYNC_COMMANDS
        value: "true"
      - key: CLEAR_GLOBAL_COMMANDS
        value: "true"
      - key: DEFAULT_AUTHORIZED_GUILD_IDS
        value: ""
      - key: AUTO_BYPASS_COOLDOWN_SECONDS
        value: "15"
      - key: AUTO_BYPASS_MAX_URLS_PER_MESSAGE
        value: "1"
      - key: STATUS_ROTATOR_INTERVAL_SECONDS
        value: "90"
      - key: USEBYPASS_API_TOKEN
        sync: false
